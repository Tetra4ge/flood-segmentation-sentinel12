arker-end="url(#ah)"/><rect x="750" y="222" width="220" height="94" rx="7" fill="#2176C2" stroke="#134F86" stroke-width="1.4"/><text x="860.0" y="255.04" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#FFFFFF">3×3 Conv (no bias)</text><text x="860.0" y="274.03999999999996" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#FFFFFF">stride 1 · padding 1 · 256 → 256</text><text x="860.0" y="293.03999999999996" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#FFFFFF">GroupNorm (8 groups) · GELU</text><text x="1040" y="255" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="600" fill="#13355E">Pᵢ : 256 × h × w</text><path d="M 970 269 L 1405 269" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="990" cy="269" r="3.5" fill="#1A1A1A"/><circle cx="1425" cy="269" r="18" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.6"/><path d="M 1413.84 257.84 L 1436.16 280.16 M 1413.84 280.16 L 1436.16 257.84" stroke="#1A1A1A" stroke-width="1.6"/><text x="1425" y="239" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" font-weight="400" fill="#475569">channel-wise multiply</text><rect x="1005" y="402" width="490" height="150" rx="10" fill="#FFF7EC" stroke="#B5650F" stroke-width="1.2" stroke-dasharray="6 4"/><text x="1020" y="426" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="start" font-weight="700" fill="#8A4B0F">Squeeze-and-Excitation gate</text><text x="1020" y="570" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" font-weight="400" fill="#8A4B0F">reduction ratio 8: 256 / 8 = 32 channels in the bottleneck</text><rect x="1018" y="448" width="106" height="82" rx="7" fill="#F9A84A" stroke="#B5650F" stroke-width="1.4"/><text x="1071.0" y="475.68" font-family="Helvetica, Ar