<svg xmlns="http://www.w3.org/2000/svg" width="1760" height="750" viewBox="0 80 1760 750"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1A1A"/></marker></defs><rect y="80" width="1760" height="750" fill="#FFFFFF"/><text x="150" y="118" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="700" fill="#1A1A1A">Encoder features at scale i</text><rect x="40" y="150" width="220" height="58" rx="7" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.4"/><text x="150.0" y="174.54" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#0B2240">Optical features Oᵢ</text><text x="150.0" y="193.54" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#0B2240">Cᵢ × h × w</text><path d="M 260 179 L 290 179 L 290 248 L 318 248" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="40" y="240" width="220" height="58" rx="7" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.4"/><text x="150.0" y="264.54" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#0B2240">Radar features Rᵢ</text><text x="150.0" y="283.54" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#0B2240">Cᵢ × h × w</text><path d="M 260 269 L 318 269" fill="none" stroke="#1A1A1A" stroke-width="1.5" marker-end="url(#ah)"/><rect x="40" y="330" width="220" height="58" rx="7" fill="#FFEDD5" stroke="#EA580C" stroke-width="1.4"/><text x="150.0" y="354.54" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" font-weight="600" fill="#2B1408">Auxiliary features Aᵢ</text><text x="150.0" y="373.54" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="400" fill="#2B1408">Cᵢᵃᵘˣ × h × w</tex